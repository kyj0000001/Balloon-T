<!DOCTYPE html>
<html>
<head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-710S0T24NE"></script>

  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Balloon Tunnel</title>
<style>
  body { margin:0; background:#0f0f0f; overflow:hidden; touch-action:none; }
  canvas { display:block; margin:auto; background:#111; touch-action:none; }
  #ui { position:absolute; top:10px; left:10px; color:white; font-family:Arial; font-size:18px; display:none; }
  #restart { position:absolute; top:10px; right:10px; padding:10px 20px; background:#e53935; color:white; border:none; font-size:16px; cursor:pointer; border-radius:4px; display:none; }
  #restart:hover { background:#c62828; }

  #record-modal {
    display:none;
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    justify-content:center; align-items:center;
    z-index:10;
  }
  #record-box {
    background:#1a1a2e;
    border:2px solid #ff6ec7;
    border-radius:12px;
    padding:30px 40px;
    text-align:center;
    font-family:Arial;
  }
  #record-box h2 { color:#ff6ec7; margin:0 0 6px; font-size:28px; }
  #record-box p { color:#ffd700; margin:0 0 18px; font-size:20px; }
  #record-name {
    padding:10px 14px;
    font-size:18px;
    border:2px solid #555;
    border-radius:6px;
    background:#111;
    color:white;
    outline:none;
    width:200px;
    text-align:center;
  }
  #record-name:focus { border-color:#ff6ec7; }
  #record-submit {
    display:block;
    margin:14px auto 0;
    padding:10px 30px;
    background:#ff6ec7;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
  }
  #record-submit:hover { background:#e055a8; }
</style>
</head>
<body>

<div id="ui"><span style="color:#ccc">Score: <span id="score">0</span></span> &nbsp; Best: <span id="best" style="color:#ffd700">0</span> &nbsp; World: <span id="world" style="color:#ff6ec7">--</span></div>
<button id="restart">Restart</button>

<div id="record-modal">
  <div id="record-box">
    <h2>NEW WORLD RECORD!</h2>
    <p id="record-score"></p>
    <input id="record-name" placeholder="Your name" maxlength="15" autocomplete="off">
    <button id="record-submit">SAVE</button>
  </div>
</div>

<canvas id="game" width="900" height="500"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
const W = c.width;
const H = c.height;

const SEG_W = 3;
const VISIBLE = Math.ceil(W / SEG_W) + 2;

const THEMES = [
  { bg: "#111111", wall: "#1a1a2e", line: "#4caf50" },
  { bg: "#0a1628", wall: "#142040", line: "#42a5f5" },
  { bg: "#1a0a28", wall: "#28143e", line: "#ab47bc" },
  { bg: "#1a1400", wall: "#2e2810", line: "#ffb74d" },
  { bg: "#0a1a14", wall: "#142e28", line: "#26a69a" },
  { bg: "#1a0a0a", wall: "#2e1414", line: "#ef5350" },
  { bg: "#0f1a0a", wall: "#1e2e14", line: "#9ccc65" },
  { bg: "#1a0a1a", wall: "#2e142e", line: "#ec407a" },
];

let state = "title";
let score = 0, scrollX = 0, speed = 2;
let right = false, down = false;
let b = { x: 200, y: 250, vy: 0, r: 14 };
let topP = [], bottomP = [];
let frameTime = 0;
let best = parseInt(localStorage.getItem("bt_best")) || 0;
let worldBest = 0;
let worldName = "";
let titleBobT = 0;
let zoneFlash = 0;
let lastZone = 0;

const FB_URL = "https://balloon-t-default-rtdb.firebaseio.com";

function loadWorldBest() {
  fetch(FB_URL + "/worldBest.json")
    .then(r => r.json())
    .then(val => {
      if (val && val.score) {
        worldBest = val.score;
        worldName = val.name || "???";
        document.getElementById("world").innerText = worldBest + " - " + worldName;
      }
    })
    .catch(() => {});
}

function saveWorldBest(newScore, name) {
  worldBest = newScore;
  worldName = name;
  document.getElementById("world").innerText = worldBest + " - " + worldName;
  fetch(FB_URL + "/worldBest.json", {
    method: "PUT",
    body: JSON.stringify({ score: newScore, name: name })
  }).catch(() => {});
}

function showRecordModal() {
  document.getElementById("record-score").innerText = "Score: " + score;
  document.getElementById("record-modal").style.display = "flex";
  const input = document.getElementById("record-name");
  input.value = "";
  setTimeout(() => input.focus(), 100);
}

function hideRecordModal() {
  document.getElementById("record-modal").style.display = "none";
}

document.getElementById("record-submit").onclick = function() {
  const name = document.getElementById("record-name").value.trim() || "Anonymous";
  saveWorldBest(score, name);
  hideRecordModal();
};

document.getElementById("record-name").addEventListener("keydown", (e) => {
  if (e.code === "Enter") document.getElementById("record-submit").click();
  e.stopPropagation();
});

document.getElementById("best").innerText = best;
loadWorldBest();

function genPath(count) {
  const start = topP.length;
  for (let i = start; i < start + count; i++) {
    const t = i * 0.02;
    const wave = Math.sin(t) * 80 + Math.sin(t * 0.35) * 40;
    topP[i] = 120 + wave;
    bottomP[i] = 380 + wave;
  }
}

function getTheme() {
  return THEMES[Math.floor(score / 3000) % THEMES.length];
}

function resetGame() {
  b = { x: 200, y: 250, vy: 0, r: 14 };
  score = 0;
  scrollX = 0;
  speed = 2;
  lastZone = 0;
  zoneFlash = 0;
  topP = [];
  bottomP = [];
  genPath(2000);
  document.getElementById("score").innerText = "0";
}

function startGame() {
  hideRecordModal();
  resetGame();
  state = "play";
  document.getElementById("ui").style.display = "block";
  document.getElementById("restart").style.display = "none";
}

genPath(2000);

window.addEventListener("keydown", (e) => {
  if (state === "title") { startGame(); return; }
  if (e.code === "ArrowRight") right = true;
  if (e.code === "ArrowDown") down = true;
  if (e.code === "ArrowRight" || e.code === "ArrowDown") e.preventDefault();
}, { passive: false });

window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowRight") right = false;
  if (e.code === "ArrowDown") down = false;
});

c.addEventListener("click", () => {
  if (state === "title") startGame();
});

c.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (state === "title") { startGame(); return; }
  down = true;
}, { passive: false });

c.addEventListener("touchend", (e) => {
  e.preventDefault();
  down = false;
}, { passive: false });

document.getElementById("restart").onclick = startGame;

function getY(arr, worldX) {
  let i = Math.floor(worldX / SEG_W);
  if (i < 0) i = 0;
  if (i >= arr.length - 1) i = arr.length - 2;
  const frac = (worldX / SEG_W) - i;
  return arr[i] * (1 - frac) + arr[i + 1] * frac;
}

function crash() {
  state = "crash";
  if (score > best) {
    best = score;
    localStorage.setItem("bt_best", best);
    document.getElementById("best").innerText = best;
  }
  if (score > worldBest) {
    showRecordModal();
  }
  document.getElementById("restart").style.display = "block";
}

function getStringPoints() {
  const knotY = b.y + b.r * 1.15 + 4;
  const len = 17;
  const segs = 8;
  const pts = [];
  for (let s = 0; s <= segs; s++) {
    const t = s / segs;
    pts.push({
      x: b.x + Math.sin(t * Math.PI * 2.5 + frameTime * 4) * (3 + t * 2),
      y: knotY + t * len
    });
  }
  return pts;
}

function update() {
  titleBobT += 0.03;
  if (state !== "play") return;

  frameTime = performance.now() / 1000;
  speed += 0.0003;
  scrollX += right ? speed * 1.5 : speed;

  const neededIdx = Math.floor((scrollX + W) / SEG_W) + 10;
  if (neededIdx >= topP.length) genPath(500);

  b.vy -= 0.015;
  if (down) b.vy += 0.08;
  b.vy *= 0.97;
  b.y += b.vy;

  const worldX = scrollX + b.x;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
    const px = worldX + Math.cos(a) * b.r;
    const py = b.y + Math.sin(a) * b.r * 1.15;
    if (py <= getY(topP, px) || py >= getY(bottomP, px)) { crash(); return; }
  }

  const sPts = getStringPoints();
  for (const pt of sPts) {
    if (pt.y <= getY(topP, scrollX + pt.x) || pt.y >= getY(bottomP, scrollX + pt.x)) {
      crash(); return;
    }
  }

  if (b.y < 0 || b.y > H) { crash(); return; }

  score++;
  document.getElementById("score").innerText = score;

  const curZone = Math.floor(score / 3000);
  if (curZone > lastZone) {
    lastZone = curZone;
    zoneFlash = 120;
  }
  if (zoneFlash > 0) zoneFlash--;
}

function drawSmallBalloon(cx, cy, r) {
  const rx = r, ry = r * 1.15;
  const grad = ctx.createRadialGradient(cx - 3, cy - 4, 1, cx, cy, r * 1.3);
  grad.addColorStop(0, "#ffaaaa");
  grad.addColorStop(0.3, "#ff5555");
  grad.addColorStop(0.7, "#ee2222");
  grad.addColorStop(1, "#990000");
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx - 3, cy - 4, 4, 2.5, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 2, cy + ry);
  ctx.lineTo(cx, cy + ry + 4);
  ctx.lineTo(cx + 2, cy + ry);
  ctx.closePath();
  ctx.fillStyle = "#aa0000";
  ctx.fill();
}

function drawTitle() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, W, H);

  const bobY = Math.sin(titleBobT) * 8;
  const bx = W / 2, by = 140 + bobY;
  drawSmallBalloon(bx, by, 22);

  ctx.strokeStyle = "#bbb";
  ctx.lineWidth = 1.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  const knotY = by + 22 * 1.15 + 4;
  ctx.moveTo(bx, knotY);
  for (let s = 1; s <= 6; s++) {
    const t = s / 6;
    ctx.lineTo(bx + Math.sin(t * Math.PI * 2.5 + titleBobT * 3) * (3 + t * 2), knotY + t * 14);
  }
  ctx.stroke();

  ctx.textAlign = "center";

  ctx.fillStyle = "white";
  ctx.font = "bold 46px Arial";
  ctx.fillText("Balloon Tunnel", W / 2, 250);

  const btnX = W / 2 - 70, btnY = 280;
  ctx.fillStyle = "#e53935";
  ctx.beginPath();
  ctx.roundRect(btnX, btnY, 140, 46, 6);
  ctx.fill();
  ctx.fillStyle = "white";
  ctx.font = "bold 22px Arial";
  ctx.fillText("PLAY", W / 2, 310);

  if (best > 0) {
    ctx.fillStyle = "#ffd700";
    ctx.font = "18px Arial";
    ctx.fillText("Your Best: " + best, W / 2, 360);
  }

  if (worldBest > 0) {
    ctx.fillStyle = "#ff6ec7";
    ctx.font = "18px Arial";
    ctx.fillText("World Best: " + worldBest + " - " + worldName, W / 2, 388);
  }

  ctx.fillStyle = "#555";
  ctx.font = "14px Arial";
  ctx.fillText("↓ or touch to descend — balloon floats up on its own", W / 2, 430);

  ctx.textAlign = "start";
}

function drawBalloon() {
  ctx.save();
  ctx.translate(b.x, b.y);
  const rx = b.r, ry = b.r * 1.15;

  ctx.beginPath();
  ctx.ellipse(2, 3, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fill();

  const grad = ctx.createRadialGradient(-4, -5, 1, 0, 0, b.r * 1.3);
  grad.addColorStop(0, "#ffaaaa");
  grad.addColorStop(0.3, "#ff5555");
  grad.addColorStop(0.7, "#ee2222");
  grad.addColorStop(1, "#990000");
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(-4, -5, 5, 3.5, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(-2, -8, 2, 1.5, -0.3, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-3, ry);
  ctx.lineTo(0, ry + 5);
  ctx.lineTo(3, ry);
  ctx.closePath();
  ctx.fillStyle = "#aa0000";
  ctx.fill();

  ctx.restore();

  const sPts = getStringPoints();
  ctx.strokeStyle = "#bbb";
  ctx.lineWidth = 1.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(b.x, b.y + b.r * 1.15 + 4);
  for (const pt of sPts) ctx.lineTo(pt.x, pt.y);
  ctx.stroke();
}

function draw() {
  if (state === "title") { drawTitle(); return; }

  const theme = getTheme();

  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, W, H);

  const startIdx = Math.floor(scrollX / SEG_W);
  const offX = scrollX % SEG_W;

  ctx.fillStyle = theme.wall;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let i = 0; i <= VISIBLE; i++) {
    let idx = startIdx + i;
    if (idx >= topP.length) idx = topP.length - 1;
    ctx.lineTo(i * SEG_W - offX, topP[idx]);
  }
  ctx.lineTo(W, 0);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i <= VISIBLE; i++) {
    let idx = startIdx + i;
    if (idx >= bottomP.length) idx = bottomP.length - 1;
    ctx.lineTo(i * SEG_W - offX, bottomP[idx]);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = theme.line;
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= VISIBLE; i++) {
    let idx = startIdx + i;
    if (idx >= topP.length) idx = topP.length - 1;
    const x = i * SEG_W - offX;
    i === 0 ? ctx.moveTo(x, topP[idx]) : ctx.lineTo(x, topP[idx]);
  }
  ctx.stroke();

  ctx.beginPath();
  for (let i = 0; i <= VISIBLE; i++) {
    let idx = startIdx + i;
    if (idx >= bottomP.length) idx = bottomP.length - 1;
    const x = i * SEG_W - offX;
    i === 0 ? ctx.moveTo(x, bottomP[idx]) : ctx.lineTo(x, bottomP[idx]);
  }
  ctx.stroke();

  drawBalloon();

  if (zoneFlash > 0) {
    const a = Math.min(1, zoneFlash / 40);
    ctx.textAlign = "center";
    ctx.font = "bold 34px Arial";
    ctx.fillStyle = theme.line;
    ctx.globalAlpha = a;
    ctx.fillText("ZONE " + (lastZone + 1), W / 2, 60);
    ctx.globalAlpha = 1;
    ctx.textAlign = "start";
  }

  if (state === "crash") {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "white";
    ctx.font = "bold 48px Arial";
    ctx.fillText("CRASH!", W / 2, H / 2 - 30);
    ctx.font = "22px Arial";
    ctx.fillText("Score: " + score, W / 2, H / 2 + 10);
    ctx.fillStyle = "#ffd700";
    ctx.font = "18px Arial";
    ctx.fillText("Best: " + best, W / 2, H / 2 + 40);
    if (worldBest > 0) {
      ctx.fillStyle = "#ff6ec7";
      ctx.fillText("World Best: " + worldBest + " - " + worldName, W / 2, H / 2 + 65);
    }
    ctx.textAlign = "start";
  }
}

function resizeCanvas() {
  const ratio = W / H;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  if (vw / vh > ratio) {
    c.style.height = vh + "px";
    c.style.width = (vh * ratio) + "px";
  } else {
    c.style.width = vw + "px";
    c.style.height = (vw / ratio) + "px";
  }
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
